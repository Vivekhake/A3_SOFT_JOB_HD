<div class="slider-container">
  <div class="slider-wrapper" [style.transform]="'translateX(' + (-currentSlide * 100) + '%)'"
    [style.transition]="isTransitioning ? 'transform 0.6s ease-in-out' : 'none'">
    <div class="slide" *ngFor="let slide of extendedSlides">
      <img [src]="slide.url" alt="Slider Image">
      <div class="slide-content" *ngIf="slide.title || slide.description">
        <h1 *ngIf="slide.title">{{ slide.title }}</h1>
        <p *ngIf="slide.description">{{ slide.description }}</p>
      </div>
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button class="nav-btn prev" (click)="prevSlide()">&#10094;</button>
  <button class="nav-btn next" (click)="nextSlide()">&#10095;</button>

  <!-- Navigation Dots -->
  <div class="dots-container">
    <span class="dot" *ngFor="let slide of originalSlides; let i = index"
      [class.active]="(i + 1) === currentSlide || (currentSlide === extendedSlides.length - 1 && i === 0) || (currentSlide === 0 && i === originalSlides.length - 1)"
      (click)="goToSlide(i)">
    </span>
  </div>
</div>
