<section class="feedback-section">
  <div class="container">
    <div class="section-header">
      <h2>Student Testimonials</h2>
      <p>Hear what our successful students have to say about their journey</p>
    </div>

    <div class="feedback-grid">
      <div class="feedback-card" *ngFor="let feedback of feedbacks">
        <div class="quote-icon">❝</div>
        <div class="stars">
          <span class="star" *ngFor="let s of getStars(feedback.rating)">★</span>
        </div>
        <p class="feedback-text">"{{ feedback.text }}"</p>
        
        <div class="student-info">
          <img [src]="feedback.image" [alt]="feedback.name" class="student-img">
          <div class="student-details">
            <h4>{{ feedback.name }}</h4>
            <span>{{ feedback.course }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
