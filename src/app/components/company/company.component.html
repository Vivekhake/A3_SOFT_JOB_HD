<div class="company-section">
  <div class="section-title">
    <h2>Top Companies Hiring Now</h2>
    <p>Join the best companies in the world</p>
  </div>

  <div class="marquee-container">
    <!-- Row 1: Right to Left -->
    <div class="marquee-track right-to-left">
      <div class="marquee-content">
        <div class="company-card" *ngFor="let company of companiesRow1">
          <a [href]="company.url" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <img [src]="company.logo" [alt]="company.name">
          </a>
        </div>
        <!-- Duplicate for infinite loop -->
        <div class="company-card" *ngFor="let company of companiesRow1">
          <a [href]="company.url" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <img [src]="company.logo" [alt]="company.name">
          </a>
        </div>
      </div>
    </div>

    <!-- Row 2: Left to Right -->
    <div class="marquee-track left-to-right">
      <div class="marquee-content">
        <div class="company-card" *ngFor="let company of companiesRow2">
          <a [href]="company.url" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <img [src]="company.logo" [alt]="company.name">
          </a>
        </div>
        <!-- Duplicate for infinite loop -->
        <div class="company-card" *ngFor="let company of companiesRow2">
          <a [href]="company.url" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <img [src]="company.logo" [alt]="company.name">
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
